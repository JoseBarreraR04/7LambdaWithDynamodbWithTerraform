# Contenedor de herramientas. Uso (desde la carpeta del proyecto):
#   docker compose build              # una sola vez
#   docker compose run --rm tools make help
name: iot-pipeline

services:
  tools:
    build: .
    image: iot-tools
    working_dir: /work
    volumes:
      # El proyecto completo (el estado de Terraform y de Chalice queda en tu disco)
      - .:/work
      # Credenciales del Learner Lab: C:\Users\<usuario>\.aws
      - ${USERPROFILE:-~}/.aws:/root/.aws
